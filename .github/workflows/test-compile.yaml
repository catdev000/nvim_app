name: Test & Compile

on:
  push:
    branches: [main, add-compiler]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      workflows_changed: ${{ steps.filter.outputs.workflows == 'true' }}
      sh_changed: ${{ steps.filter.outputs.sh == 'true' }}
      bat_changed: ${{ steps.filter.outputs.bat == 'true' }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Detect file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            workflows:
              - '.github/workflows/**'
            sh:
              - 'nvim_app.sh'
            bat:
              - 'nvim_app.bat'

  test-linux:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.workflows_changed == 'true' || needs.detect-changes.outputs.sh_changed == 'true' }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Testing Linux Installation
        run: |
          bash nvim_app.sh --pipeline

  test-macOS:
    runs-on: macos-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.workflows_changed == 'true' || needs.detect-changes.outputs.sh_changed == 'true' }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      
      - name: Uninstall Homebrew
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/uninstall.sh)"
          sudo rm -rf /opt/homebrew
          sudo rm -rf /usr/local/Homebrew
          rm -rf ~/Library/Caches/Homebrew

      - name: Testing MacOS Installation
        run: |
          bash nvim_app.sh --pipeline

  test-windows:
    runs-on: windows-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.workflows_changed == 'true' || needs.detect-changes.outputs.bat_changed == 'true' }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Uninstall Chocolatey (if installed)
        run: |
          if (Test-Path "C:\ProgramData\chocolatey") {
            Remove-Item -Recurse -Force "C:\ProgramData\chocolatey"
          }

      - name: Testing Windows Installation
        shell: cmd
        run: |
          nvim_app.bat --pipeline

  windows-compile:
    needs: [detect-changes, test-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Install PyInstaller
        run: pip install pyinstaller
      
      - name: Compile nvim_app.bat to exe
        run: |
          pyinstaller --onefile --name nvim-app nvim_app.bat
        shell: cmd
      
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: nvim-app-windows
          path: dist/nvim-app.exe

  linux-compile:
    needs: [detect-changes, test-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Make executable and package as AppImage
        uses: AppImageCommunity/github-actions-appimage-builder@v1
        with:
          appdir: True
          base: ubuntu20.04
          file: nvim_app.sh
          arch: x86_64
      
      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: nvim-app-linux
          path: nvim-app*.AppImage

  macos-compile:
    needs: [detect-changes, test-macOS]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Install PyInstaller
        run: pip install pyinstaller
      
      - name: Compile to macOS app
        run: |
          pyinstaller --onefile --name nvim-app nvim_app.sh
      
      - name: Create DMG
        run: |
          hdiutil create -volname "nvim-app" -srcfolder dist -ov -format UDZO nvim-app.dmg
      
      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: nvim-app-macos
          path: nvim-app.dmg

